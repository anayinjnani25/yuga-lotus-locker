<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Yuga Locker Cutaway</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Yatra+One&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
/* Layout: a dark studio stage carries the render and its callouts; the parts key sits below on the page theme */
:root{
  --bg:#ECE6DC; --ink:#2A2118; --muted:#6B5F52; --card:#FFFCF6; --line:#DCD0BE; --accent:#A8662F; --btn:#5A3A22; --btn-ink:#FFF6E6;
  --studio-a:#3B2A1D; --studio-b:#110B07; --co-ink:#F6EBDD; --co-line:rgba(246,235,221,.7);
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1B1512; --ink:#F2E8D8; --muted:#BFAE97; --card:#2A211B; --line:#4A3B2E; --accent:#E0A060; --btn:#E0A060; --btn-ink:#1B1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1B1512; --ink:#F2E8D8; --muted:#BFAE97; --card:#2A211B; --line:#4A3B2E; --accent:#E0A060; --btn:#E0A060; --btn-ink:#1B1512; color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Nunito",system-ui,sans-serif;font-size:16px;line-height:1.55;padding:0 16px}
header{max-width:1240px;margin:0 auto;padding-block:20px 10px;display:flex;flex-wrap:wrap;gap:10px 24px;align-items:end;justify-content:space-between}
h1{font-family:"Yatra One",serif;font-weight:400;font-size:2.1rem;line-height:1.15;margin:0}
h2{font-family:"Yatra One",serif;font-weight:400;font-size:1.4rem;margin:0 0 12px}
header p{margin:4px 0 0;color:var(--muted);max-width:62ch}
.views{display:flex;flex-wrap:wrap;gap:6px}
button{font:inherit;font-weight:800;font-size:.88rem;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;cursor:pointer}
button[aria-pressed="true"]{background:var(--btn);border-color:var(--btn);color:var(--btn-ink)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
#stage{position:relative;max-width:1240px;margin:0 auto;height:min(78vh,820px);min-height:420px;border-radius:16px;overflow:hidden;touch-action:none;cursor:grab;
  background:radial-gradient(ellipse at 50% 42%,var(--studio-a) 0%,var(--studio-b) 72%)}
#stage:active{cursor:grabbing}
#stage canvas{display:block;width:100%;height:100%}
#lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#callouts{position:absolute;inset:0;pointer-events:none}
.co{position:absolute;top:0;left:0;font-size:.8rem;font-weight:700;color:var(--co-ink);white-space:nowrap;line-height:1.2;text-shadow:0 1px 2px rgba(0,0,0,.8)}
.co b{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:#E0A060;color:#1B1208;font-size:.68rem;margin-right:6px;vertical-align:-3px;text-shadow:none}
.co.right b{margin:0 0 0 6px}
.badge{position:absolute;top:0;left:0;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;background:#E0A060;color:#1B1208;font-size:.7rem;font-weight:800;display:none;place-items:center}
#stage.compact .co{display:none} #stage.compact .badge{display:grid}
#stage.nolabels .co,#stage.nolabels .badge,#stage.nolabels #lines{display:none}
#hint{position:absolute;left:16px;bottom:12px;font-size:.78rem;color:rgba(246,235,221,.6);pointer-events:none}
#loading{position:absolute;inset:0;display:grid;place-items:center;color:var(--co-ink);font-weight:700}
main{max-width:1240px;margin:0 auto;padding-block:22px 44px}
.key{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px;counter-reset:k}
.key li{counter-increment:k;display:grid;grid-template-columns:28px minmax(0,1fr);gap:10px;background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:10px 12px}
.key li::before{content:counter(k);width:24px;height:24px;border-radius:50%;background:var(--accent);color:var(--card);display:grid;place-items:center;font-weight:800;font-size:.78rem}
.key b{display:block;font-weight:800}
.key span{color:var(--muted);font-size:.9rem}
.group{font-family:"Yatra One",serif;color:var(--muted);margin:18px 0 8px;font-size:1.05rem}
@media (max-width:560px){h1{font-size:1.7rem}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Yuga Locker Cutaway</h1>
    <p>Rear view through the clear acrylic back wall. Drag to turn the box, scroll or pinch to zoom.</p>
  </div>
  <div class="views" role="group" aria-label="Camera views">
    <button data-view="rear" aria-pressed="true">Rear cutaway</button>
    <button data-view="mech">Mechanism</button>
    <button data-view="lotus">Lotus</button>
    <button data-view="base">Electronics</button>
    <button data-view="front">Carved front</button>
    <button id="lblBtn" aria-pressed="true">Callouts</button>
  </div>
</header>

<div id="stage">
  <div id="loading">Carving and wiring the box…</div>
  <svg id="lines" aria-hidden="true"></svg>
  <div id="callouts"></div>
  <div id="hint">Drag to rotate</div>
</div>

<main>
  <h2>Parts</h2>
  <ol class="key" id="key"></ol>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(async function(){
try{await Promise.race([Promise.all([document.fonts.load('40px "Yatra One"','SATYA'),document.fonts.load('800 20px "Nunito"','1')]),new Promise(r=>setTimeout(r,2500))]);}catch(e){}
await new Promise(r=>setTimeout(r,30));

const YUGA=[
  {en:'Satya',metal:'#E8B84A',hex:0xE8B84A,dark:'#6E4E0E',legs:4,rough:.28},
  {en:'Treta',metal:'#DDE2E8',hex:0xDDE2E8,dark:'#4E5560',legs:3,rough:.3},
  {en:'Dwapara',metal:'#D07A48',hex:0xC87040,dark:'#5E2A10',legs:2,rough:.32},
  {en:'Kali',metal:'#8A8E96',hex:0x6A6E76,dark:'#1E2024',legs:1,rough:.55}];
const DISP='"Yatra One",serif';

// ================= canvas helpers =================
function mk(w,h){const c=document.createElement('canvas');c.width=w;c.height=h;return c;}
function hc(v){const c=Math.round(Math.max(0,Math.min(1,v))*255);return 'rgb('+c+','+c+','+c+')';}
function C(g,x,y,r,v){g.fillStyle=hc(v);g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function blur(a,w,h,r){const t=new Float32Array(a.length),o=new Float32Array(a.length),n=2*r+1;
  for(let y=0;y<h;y++){const row=y*w;let s=0;for(let x=-r;x<=r;x++)s+=a[row+Math.min(w-1,Math.max(0,x))];for(let x=0;x<w;x++){t[row+x]=s/n;s+=a[row+Math.min(w-1,x+r+1)]-a[row+Math.max(0,x-r)];}}
  for(let x=0;x<w;x++){let s=0;for(let y=-r;y<=r;y++)s+=t[Math.min(h-1,Math.max(0,y))*w+x];for(let y=0;y<h;y++){o[y*w+x]=s/n;s+=t[Math.min(h-1,y+r+1)*w+x]-t[Math.max(0,y-r)*w+x];}}
  return o;}
function heightOf(canvas,invert,r){const w=canvas.width,h=canvas.height,d=canvas.getContext('2d').getImageData(0,0,w,h).data;let H=new Float32Array(w*h);
  for(let i=0;i<w*h;i++){const l=(d[i*4]*.3+d[i*4+1]*.59+d[i*4+2]*.11)/255;H[i]=invert?1-l:l;}if(r){H=blur(H,w,h,r);H=blur(H,w,h,r);}return H;}
function normalTex(H,w,h,s){const c=mk(w,h),g=c.getContext('2d'),im=g.createImageData(w,h),d=im.data;
  for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=y*w+x;const nx=(H[x>0?i-1:i]-H[x<w-1?i+1:i])*s,ny=(H[y<h-1?i+w:i]-H[y>0?i-w:i])*s;const l=Math.sqrt(nx*nx+ny*ny+1);
    d[i*4]=(nx/l*.5+.5)*255;d[i*4+1]=(ny/l*.5+.5)*255;d[i*4+2]=(1/l*.5+.5)*255;d[i*4+3]=255;}
  g.putImageData(im,0,0);const t=new THREE.CanvasTexture(c);t.anisotropy=4;return t;}
function grain(g,w,h,base,line){g.fillStyle=base;g.fillRect(0,0,w,h);g.strokeStyle=line;
  for(let i=0;i<90;i++){g.globalAlpha=.12+Math.random()*.18;g.lineWidth=Math.random()*2.2+.4;g.beginPath();const y=Math.random()*h;g.moveTo(0,y);g.bezierCurveTo(w*.3,y+Math.random()*24-12,w*.7,y+Math.random()*24-12,w,y+Math.random()*18-9);g.stroke();}
  g.globalAlpha=1;}
function bakeCarving(w,h,draw,opt){opt=opt||{};const hcv=mk(w,h),g=hcv.getContext('2d');draw(g,w,h);
  const H=heightOf(hcv,false,Math.max(1,Math.round(2*w/1024)));const wc=mk(w,h),wg=wc.getContext('2d');grain(wg,w,h,opt.base||'#6B4428',opt.line||'#2E1A0C');
  const wd=wg.getImageData(0,0,w,h),d=wd.data;
  for(let i=0;i<w*h;i++){const hv=H[i],sh=.28+.9*hv,hi=hv>.86?(hv-.86)*160:0;d[i*4]=Math.min(255,d[i*4]*sh+hi);d[i*4+1]=Math.min(255,d[i*4+1]*sh+hi*.8);d[i*4+2]=Math.min(255,d[i*4+2]*sh+hi*.5);}
  wg.putImageData(wd,0,0);const map=new THREE.CanvasTexture(wc);map.anisotropy=4;return {map,normalMap:normalTex(H,w,h,(opt.strength||9)*w/1024)};}
function petalPath(g,x,yb,w,h){g.beginPath();g.moveTo(x-w/2,yb);g.bezierCurveTo(x-w*.62,yb-h*.55,x-w*.2,yb-h*.8,x,yb-h);g.bezierCurveTo(x+w*.2,yb-h*.8,x+w*.62,yb-h*.55,x+w/2,yb);g.closePath();}
function carvedPetal(g,x,yb,w,h,lo,hi){g.fillStyle=hc(lo);petalPath(g,x,yb,w,h);g.fill();g.fillStyle=hc(hi);petalPath(g,x,yb-h*.1,w*.6,h*.7);g.fill();
  g.strokeStyle=hc(lo-.25);g.lineWidth=Math.max(2,w*.06);g.beginPath();g.moveTo(x,yb-h*.12);g.lineTo(x,yb-h*.62);g.stroke();}
function rosette(g,x,y,r){g.save();g.translate(x,y);g.fillStyle=hc(.95);for(let j=0;j<8;j++){g.rotate(Math.PI/4);g.beginPath();g.ellipse(0,-r*.55,r*.2,r*.42,0,0,Math.PI*2);g.fill();}g.restore();C(g,x,y,r*.28,.5);C(g,x,y,r*.14,1);}
function drawFrame(g){g.fillStyle=hc(.85);g.fillRect(0,0,1024,1024);g.fillStyle=hc(.1);g.fillRect(56,56,912,912);g.fillStyle=hc(.55);g.fillRect(66,66,892,892);
  for(let t=84;t<=940;t+=28){[[t,90],[t,934],[90,t],[934,t]].forEach(p=>C(g,p[0],p[1],10,.97));}
  g.fillStyle=hc(.12);g.fillRect(114,114,796,796);g.fillStyle=hc(.38);g.fillRect(122,122,780,780);
  for(let s=0;s<4;s++){g.save();g.translate(512,512);g.rotate(s*Math.PI/2);g.translate(-512,-512);for(let x=232;x<=792;x+=44)carvedPetal(g,x,196,40,68,.7,.96);g.restore();}
  [[159,159],[865,159],[159,865],[865,865]].forEach(p=>{g.fillStyle=hc(.72);g.fillRect(p[0]-34,p[1]-34,68,68);rosette(g,p[0],p[1],30);});
  g.fillStyle=hc(.9);g.fillRect(196,196,632,632);g.fillStyle=hc(.14);g.fillRect(206,206,612,612);g.fillStyle=hc(.3);g.fillRect(212,212,600,600);}
function lotusMandala(g,cx,cy,r){C(g,cx,cy,r,.88);C(g,cx,cy,r*.95,.15);for(let j=0;j<40;j++){const a=j*Math.PI/20;C(g,cx+Math.cos(a)*r*.89,cy+Math.sin(a)*r*.89,r*.03,.97);}
  C(g,cx,cy,r*.83,.28);g.save();g.translate(cx,cy);for(let j=0;j<16;j++){g.rotate(Math.PI/8);carvedPetal(g,0,-r*.3,r*.26,r*.5,.6,.86);}
  g.rotate(Math.PI/16);for(let j=0;j<8;j++){g.rotate(Math.PI/4);carvedPetal(g,0,-r*.18,r*.3,r*.42,.74,1);}g.restore();
  C(g,cx,cy,r*.24,.5);C(g,cx,cy,r*.2,.92);for(let j=0;j<7;j++){const a=j*Math.PI*2/7;C(g,cx+Math.cos(a)*r*.11,cy+Math.sin(a)*r*.11,r*.03,.3);}}
function chakra(g,cx,cy,r){C(g,cx,cy,r,.9);C(g,cx,cy,r*.92,.22);for(let j=0;j<32;j++){const a=j*Math.PI/16;C(g,cx+Math.cos(a)*r*.96,cy+Math.sin(a)*r*.96,r*.026,.99);}
  C(g,cx,cy,r*.84,.88);C(g,cx,cy,r*.74,.14);g.save();g.translate(cx,cy);for(let j=0;j<8;j++){g.rotate(Math.PI/4);g.fillStyle=hc(.86);g.fillRect(-r*.05,-r*.75,r*.1,r*.75);}
  g.rotate(Math.PI/8);for(let j=0;j<8;j++){g.rotate(Math.PI/4);g.fillStyle=hc(.68);g.fillRect(-r*.02,-r*.75,r*.04,r*.75);}g.restore();
  for(let j=0;j<8;j++){const a=j*Math.PI/4-Math.PI/2;C(g,cx+Math.cos(a)*r*.47,cy+Math.sin(a)*r*.47,r*.09,.97);C(g,cx+Math.cos(a)*r*.47,cy+Math.sin(a)*r*.47,r*.045,.55);}
  C(g,cx,cy,r*.26,.9);rosette(g,cx,cy,r*.22);}
function torana(g){g.fillStyle=hc(.06);g.beginPath();g.moveTo(292,800);g.lineTo(292,460);g.ellipse(512,460,220,230,0,Math.PI,Math.PI*2);g.lineTo(732,800);g.closePath();g.fill();
  for(let j=1;j<8;j++){const a=Math.PI+j*Math.PI/8;C(g,512+Math.cos(a)*220,460+Math.sin(a)*230,26,.06);}
  g.strokeStyle=hc(.88);g.lineWidth=22;g.beginPath();g.ellipse(512,460,264,272,0,Math.PI,Math.PI*2);g.stroke();
  [226,744].forEach(x=>{g.fillStyle=hc(.86);g.fillRect(x,450,54,340);g.fillStyle=hc(.97);g.fillRect(x-12,428,78,26);g.fillRect(x-12,782,78,26);});
  rosette(g,258,258,42);rosette(g,766,258,42);}

// ================= leaf & petal shapes =================
const LL=2.3,LW=.58;
function lw(v){return Math.pow(Math.sin(Math.PI*Math.pow(v,.62)),1.25)+.35*Math.pow(1-v,3);}
function leafPt(u,v){const w=LW*lw(v);return[u*w,v*LL-.12*LL*Math.abs(u)*Math.pow(1-v,2),-.16*Math.abs(u)*w+.1*Math.sin(Math.PI*v)+.03*Math.sin(v*20)*Math.pow(Math.abs(u),3)];}
const PL=2.4,PW=.62;
function pw(v){return .25*(1-v)+Math.pow(Math.sin(Math.PI*Math.pow(v,.8)),.85);}
function petalPt(u,v){const w=PW*pw(v);return[u*w,v*PL,-.4*u*u*w+.22*Math.pow(v,3)-.05*Math.sin(Math.PI*v)];}
function sheet(nu,nv,fn){const pos=[],uv=[],idx=[];
  for(let j=0;j<=nv;j++){const v=j/nv;for(let i=0;i<=nu;i++){const u=i/nu*2-1,p=fn(u,v);pos.push(p[0],p[1],p[2]);uv.push((u+1)/2,v);}}
  for(let j=0;j<nv;j++)for(let i=0;i<nu;i++){const a=j*(nu+1)+i,b=a+1,c=a+nu+1,d=c+1;idx.push(a,c,b,b,c,d);}
  const g=new THREE.BufferGeometry();g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3));g.setAttribute('uv',new THREE.Float32BufferAttribute(uv,2));g.setIndex(idx);g.computeVertexNormals();return g;}

// ================= three.js setup =================
const stage=document.getElementById('stage');
const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio,2));
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
stage.insertBefore(renderer.domElement,stage.firstChild);
const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(34,1,.1,200);

scene.add(new THREE.HemisphereLight(0xffe6c8,0x2a1a10,.42));
const key=new THREE.SpotLight(0xffd6a0,1.5,60,.55,.65,1.2);key.position.set(-7,11,-8);key.target.position.set(0,1,0);
key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-.0004;key.shadow.normalBias=.02;scene.add(key,key.target);
const rim=new THREE.DirectionalLight(0xffc890,.55);rim.position.set(7,6,8);scene.add(rim);
const inner=new THREE.PointLight(0xffc78a,.75,7,1.6);inner.position.set(-.6,3.4,-.9);scene.add(inner);
const bayLight=new THREE.PointLight(0xfff0d8,.55,5,1.6);bayLight.position.set(-.4,-.6,-1.2);scene.add(bayLight);
(function(){const c=mk(1024,512),g=c.getContext('2d');const gr=g.createLinearGradient(0,0,0,512);
  gr.addColorStop(0,'#FFF0DC');gr.addColorStop(.45,'#B88A5C');gr.addColorStop(.55,'#4A3424');gr.addColorStop(1,'#120B06');g.fillStyle=gr;g.fillRect(0,0,1024,512);
  [[240,110,120],[760,140,90],[520,60,70]].forEach(([x,y,r])=>{const rg=g.createRadialGradient(x,y,0,x,y,r);rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(x-r,y-r,r*2,r*2);});
  const t=new THREE.CanvasTexture(c);const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromEquirectangular(t).texture;t.dispose();pm.dispose();})();

const M=(c,o)=>new THREE.MeshStandardMaterial(Object.assign({color:c,roughness:.7,metalness:0,envMapIntensity:.5},o||{}));
const W=(b,o)=>new THREE.MeshStandardMaterial(Object.assign({map:b.map,normalMap:b.normalMap,normalScale:new THREE.Vector2(1.5,1.5),roughness:.62,envMapIntensity:.45},o||{}));
const brass=M(0xC9A04A,{metalness:1,roughness:.3,envMapIntensity:1});
const darkBrass=M(0x8A6A34,{metalness:1,roughness:.45,envMapIntensity:1});
const teakEdge=M(0x4E3020,{roughness:.8}),teakIn=M(0x6E4A2E,{roughness:.75});
const root=new THREE.Group();scene.add(root);
function box(w,h,d,m,x,y,z,p){const b=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),m);b.position.set(x,y,z);(p||root).add(b);return b;}
const Y=new THREE.Vector3(0,1,0);
function rodBetween(a,b,r,m,p){const d=new THREE.Vector3().subVectors(b,a),L=d.length();const c=new THREE.Mesh(new THREE.CylinderGeometry(r,r,L,12),m);
  c.position.copy(a).addScaledVector(d,.5);c.quaternion.setFromUnitVectors(Y,d.normalize());(p||root).add(c);return c;}
class Helix extends THREE.Curve{constructor(r,h,turns){super();this.r=r;this.h=h;this.t=turns;}getPoint(t,o){o=o||new THREE.Vector3();const a=t*this.t*Math.PI*2;return o.set(this.r*Math.cos(a),t*this.h,this.r*Math.sin(a));}}
const springMat=M(0xBFC4C8,{metalness:1,roughness:.25,envMapIntensity:1.2});
function springBetween(a,b,r,turns,wire,p){const d=new THREE.Vector3().subVectors(b,a),L=d.length();
  const m=new THREE.Mesh(new THREE.TubeGeometry(new Helix(r,L,turns),Math.ceil(turns*20),wire,6,false),springMat);
  m.position.copy(a);m.quaternion.setFromUnitVectors(Y,d.normalize());(p||root).add(m);return m;}
function wire(pts,color,r){const c=new THREE.CatmullRomCurve3(pts.map(p=>new THREE.Vector3(...p)));
  const m=new THREE.Mesh(new THREE.TubeGeometry(c,80,r||.018,6,false),M(color,{roughness:.45,envMapIntensity:.6}));root.add(m);return m;}
const glowTex=(function(){const c=mk(64,64),g=c.getContext('2d');const rg=g.createRadialGradient(32,32,0,32,32,32);rg.addColorStop(0,'rgba(255,255,255,1)');rg.addColorStop(.25,'rgba(255,255,255,.6)');rg.addColorStop(1,'rgba(255,255,255,0)');g.fillStyle=rg;g.fillRect(0,0,64,64);return new THREE.CanvasTexture(c);})();
function led(x,y,z,col,size){col=col||0x45FF7A;const s=new THREE.Mesh(new THREE.SphereGeometry(.035,10,8),new THREE.MeshBasicMaterial({color:col}));s.position.set(x,y,z);root.add(s);
